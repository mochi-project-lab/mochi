<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mochi</title>
<link rel="stylesheet" href="ui.css">
<style>
  body { width: 300px; padding: 14px; }
  .hero { display: flex; align-items: center; gap: 12px; padding: 12px; }
  .hero canvas { width: 56px; height: 56px; animation: bob 2.6s ease-in-out infinite; }
  @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
  .hero .nm { font-size: 15px; }
  .hero .st { font-size: 12px; display: flex; align-items: center; gap: 6px; margin-top: 3px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: #B9B4C6; }
  .dot.on { background: #2FB383; } .dot.off { background: var(--danger); }
  .list { margin-top: 12px; padding: 4px 12px; }
  .item { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 9px 0; }
  .item + .item { border-top: 1.5px dashed var(--soft); }
  .item small { display: block; color: var(--muted); font-size: 11.5px; }
  .acts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
  .foot { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; font-size: 12px; }
  .foot a { color: var(--muted); text-decoration: none; }
  .foot a:hover { color: var(--ink); text-decoration: underline; }
  .note { font-size: 12px; color: var(--muted); margin-top: 10px; display: none; }
  .note.show { display: block; }
</style>
</head>
<body>
  <div class="box hero">
    <canvas class="sprite" id="pet" width="16" height="16"></canvas>
    <div>
      <div class="px nm" id="name">Mochi</div>
      <div class="st muted"><i class="dot" id="dot"></i><span id="status">checking…</span></div>
    </div>
  </div>

  <div class="box list">
    <div class="item">
      <div><b>Pet on</b><small>everywhere</small></div>
      <label class="sw"><input type="checkbox" id="enabled"><span></span></label>
    </div>
    <div class="item">
      <div><b>Show here</b><small id="host">—</small></div>
      <label class="sw"><input type="checkbox" id="here"><span></span></label>
    </div>
  </div>

  <div class="acts">
    <button class="btn" id="scan">Scan page</button>
    <button class="btn ghost" id="site">Check site</button>
  </div>
  <div class="note" id="note"></div>

  <div class="foot">
    <a href="#" id="options">Settings</a>
    <span class="muted">Alt+P opens chat</span>
  </div>
<script src="sprite.js"></script>
<script src="common.js"></script>
<script src="popup.js"></script>
</body>
</html>
